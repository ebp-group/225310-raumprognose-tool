site_name: Raumprognose Tool – Dokumentation
site_description: Benutzerhandbuch für das Raumprognose Tool (Flet Desktop-Applikation)
site_author: EBP
repo_url: https://github.com/ebp-group/225310-raumprognose-tool
repo_name: ebp-group/225310-raumprognose-tool

docs_dir: docs
site_dir: site

theme:
  name: material
  language: de
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Dunkelmodus aktivieren
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Hellmodus aktivieren
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Startseite: index.md
  - Benutzerhandbuch:
      - Daten laden: datenladen.md
      - Szenario wählen & berechnen: szenario.md
      - Ergebnisse anzeigen: ergebnisse.md
      - Diagramme: diagramme.md
      - Export: export.md

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
