[project]
name = "raumprognose-tool"
version = "1.2.0"
description = "Raumprognose Tool – Flet desktop UI with pandas/DuckDB calculations and optional dbt batch pipeline"
requires-python = ">=3.10"
dependencies = [
    "dbt-duckdb",
    "duckdb",
    "flet",
    "pandas",
    "openpyxl",
    "matplotlib",
    "flet-datatable2>=0.84.0",
    "marimo",
]

[project.optional-dependencies]
dev = [
    "black",
    "pre-commit",
    "ruff",
    "pytest",
]

[project.scripts]
run_pipeline = "scripts.run_pipeline:main"

[tool.setuptools]
packages = ["app", "scripts"]
py-modules = ["__init__"] # dash, not underscore

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
