name: Build Windows App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build Windows executable
        run: uv run flet pack app/flet_app.py --name RaumprognoseTool

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: RaumprognoseTool-windows
          path: dist/

      - name: Zip release asset
        if: github.event_name == 'release'
        run: Compress-Archive -Path dist\* -DestinationPath RaumprognoseTool-windows.zip

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: RaumprognoseTool-windows.zip
