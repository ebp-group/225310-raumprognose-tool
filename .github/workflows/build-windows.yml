name: Build Windows App

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies (including dev extras)
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest

  build:
    runs-on: windows-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); d=tomllib.load(f); print(d['project']['version'])")
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "${VERSION}" > app/assets/version.txt

      - name: Build Windows executable
        run: uv run flet pack app/flet_app.py --name RaumprognoseTool --icon app/assets/icon.ico --add-data=app/assets:assets --product-version '${{ steps.version.outputs.VERSION }}'

      - name: Upload build artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: RaumprognoseTool-windows
          path: dist/

      - name: Zip release asset
        if: github.event_name == 'release'
        run: Compress-Archive -Path dist\* -DestinationPath RaumprognoseTool-windows.zip

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: RaumprognoseTool-windows.zip
